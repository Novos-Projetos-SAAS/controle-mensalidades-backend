name: Homologacao indicadores financeiros - banco descartavel
on:
  pull_request:
    branches: [main]
  push:
    branches: [review/financeiro-indicadores-20261122]
permissions:
  contents: read
jobs:
  leitura-financeira:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financeiro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financeiro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      AMBIENTE_BANCO: teste
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/financeiro_ci
      DB_SSL: 'false'
      CPF_CRYPTO_MODE: transition
      WHATSAPP_META_REAL_SEND_ENABLED: 'false'
      JWT_SECRET_TEST: ci-financeiro-ficticio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Chaves efemeras e env isolado
        run: |
          node -e "const fs=require('node:fs');const {randomBytes}=require('node:crypto');fs.appendFileSync(process.env.GITHUB_ENV,['CPF_ENCRYPTION_KEY='+randomBytes(32).toString('hex'),'CPF_LOOKUP_KEY='+randomBytes(32).toString('hex'),'WHATSAPP_CREDENTIALS_ENCRYPTION_KEY='+randomBytes(32).toString('base64')].join(String.fromCharCode(10))+String.fromCharCode(10))"
          touch .env.test
      - run: npm run migrate:latest -- --env test
      - run: npm run typecheck
      - name: Testes de financeiro com isolamento e saldos
        run: node --env-file=.env.test --import tsx --test tests/modules/financeiro/financeiro.routes.test.ts
      - run: npm run lint
