info:
  name: Buscar por Id
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/profissionais/{{profissional-id}}"
  headers:
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
