info:
  name: Listar inativos
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/profissionais?ativo=false"
  headers:
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  params:
    - name: ativo
      value: "false"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
