info:
  name: Buscar com Id inválido
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/profissionais/id-invalido"
  headers:
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
