info:
  name: Filtrar por ativos
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/clientes?ativo=true"
  headers:
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
  params:
    - name: ativo
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
