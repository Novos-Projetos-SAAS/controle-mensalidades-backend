info:
  name: Filtrar por inativos
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/clientes?ativo=false"
  headers:
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
  params:
    - name: ativo
      value: "false"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
