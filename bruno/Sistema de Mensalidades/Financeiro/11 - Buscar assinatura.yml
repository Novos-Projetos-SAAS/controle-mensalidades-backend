info:
  name: 11 - Buscar assinatura
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/financeiro/assinaturas/{{financeiro-assinatura-id}}"
  headers:
    - name: Cookie
      value: "{{financeiro-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("assinatura consultada dentro do contexto", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.id).to.equal(bru.getVar("financeiro-assinatura-id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
