info:
  name: 05 - Sem autenticacao
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/financeiro/planos"
  headers:
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
  auth: inherit

runtime:
  scripts:
    - type: pre-request
      code: |-
        await bru.cookies.jar().deleteCookie(bru.getEnvVar("baseUrl"), "token");
    - type: tests
      code: |-
        test("financeiro exige sessão", function() {
          expect(res.status).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
