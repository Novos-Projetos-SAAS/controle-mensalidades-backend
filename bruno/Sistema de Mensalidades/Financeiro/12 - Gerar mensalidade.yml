info:
  name: 12 - Gerar mensalidade
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/financeiro/assinaturas/{{financeiro-assinatura-id}}/mensalidades"
  headers:
    - name: Cookie
      value: "{{financeiro-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
  body:
    type: json
    data: |-
      {
        "competencia": "2024-02"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) bru.setVar("financeiro-mensalidade-id", res.body.data.mensalidade.id);
    - type: tests
      code: |-
        test("mensalidade da competência é gerada", function() {
          expect(res.status).to.equal(201);
          expect(res.body.data.mensalidade.vencimento_em).to.equal("2024-02-05");
          expect(bru.getVar("financeiro-mensalidade-id")).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
