info:
  name: 06 - Listar planos
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/financeiro/planos"
  headers:
    - name: Cookie
      value: "{{financeiro-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("lista planos da área e globais sem vazar outra área", function() {
          const ids = res.body.data.map(function(plano) { return plano.id; });
          expect(res.status).to.equal(200);
          expect(ids).to.include(bru.getEnvVar("financeiro-plano-existente-id"));
          expect(ids).to.include(bru.getEnvVar("financeiro-plano-global-id"));
          expect(ids).to.not.include(bru.getEnvVar("financeiro-plano-outra-area-id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
