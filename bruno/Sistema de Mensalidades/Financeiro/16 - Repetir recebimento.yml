info:
  name: 16 - Repetir recebimento
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/financeiro/mensalidades/{{financeiro-mensalidade-id}}/recebimentos"
  headers:
    - name: Cookie
      value: "{{financeiro-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
    - name: Idempotency-Key
      value: "{{financeiro-chave-parcial}}"
  body:
    type: json
    data: |-
      {
        "valor": "25.00",
        "forma_pagamento": "PIX",
        "pago_em": "2024-02-05T12:00:00-03:00"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("repetição idêntica devolve o recebimento original", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.repetido).to.equal(true);
          expect(res.body.data.pagamento.id).to.equal(bru.getVar("financeiro-pagamento-parcial-id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
