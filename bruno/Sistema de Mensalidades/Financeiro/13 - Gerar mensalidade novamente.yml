info:
  name: 13 - Gerar mensalidade novamente
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/financeiro/assinaturas/{{financeiro-assinatura-id}}/mensalidades"
  headers:
    - name: Cookie
      value: "{{financeiro-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
  body:
    type: json
    data: |-
      {
        "competencia": "2024-02"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("geração repetida retorna mensalidade existente", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.criada).to.equal(false);
          expect(res.body.data.mensalidade.id).to.equal(bru.getVar("financeiro-mensalidade-id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
