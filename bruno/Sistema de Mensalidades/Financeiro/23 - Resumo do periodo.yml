info:
  name: 23 - Resumo do periodo
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/financeiro/resumo?inicio=2024-02-01&fim=2024-02-29"
  headers:
    - name: Cookie
      value: "{{financeiro-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("resumo usa limites de organização, área e período", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.periodo.inicio).to.equal("2024-02-01");
          expect(res.body.data.periodo.fim).to.equal("2024-02-29");
          expect(res.body.data.recebido_periodo).to.equal("100.00");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
