info:
  name: 01 - Login administrador
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{financeiro-admin-email}}",
        "senha": "{{financeiro-admin-senha}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const setCookie = res.getHeader("set-cookie");
          const cookies = Array.isArray(setCookie) ? setCookie : [setCookie];
          const tokenCookie = cookies.map(String).find(function(cookie) { return cookie.startsWith("token="); });
          if (tokenCookie) bru.setVar("financeiro-admin-cookie", tokenCookie.split(";")[0]);
        }
    - type: tests
      code: |-
        test("administrador autentica", function() {
          expect(res.status).to.equal(200);
          expect(bru.getVar("financeiro-admin-cookie")).to.match(/^token=.+/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
