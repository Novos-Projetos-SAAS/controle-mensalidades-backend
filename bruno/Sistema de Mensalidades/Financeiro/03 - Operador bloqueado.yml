info:
  name: 03 - Operador bloqueado
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/financeiro/planos"
  headers:
    - name: Cookie
      value: "{{financeiro-operador-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("operador recebe 403 sem dados financeiros", function() {
          expect(res.status).to.equal(403);
          expect(res.body.codigo).to.equal("PERFIL_NAO_AUTORIZADO");
          expect(res.body.data).to.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
