info:
  name: 10 - Criar assinatura
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/financeiro/assinaturas"
  headers:
    - name: Cookie
      value: "{{financeiro-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-id}}"
  body:
    type: json
    data: |-
      {
        "cliente_id": "{{financeiro-cliente-id}}",
        "plano_comercial_id": "{{financeiro-plano-criado-id}}",
        "dia_vencimento": 5,
        "inicio_em": "2024-01-01"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) bru.setVar("financeiro-assinatura-id", res.body.data.id);
    - type: tests
      code: |-
        test("assinatura registra cliente, plano e valor contratado", function() {
          expect(res.status).to.equal(201);
          expect(res.body.data.cliente_id).to.equal(bru.getEnvVar("financeiro-cliente-id"));
          expect(res.body.data.valor_contratado).to.equal("100.00");
          expect(bru.getVar("financeiro-assinatura-id")).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
