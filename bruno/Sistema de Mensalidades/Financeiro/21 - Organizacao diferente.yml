info:
  name: 21 - Organizacao diferente
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/financeiro/planos"
  headers:
    - name: Cookie
      value: "{{financeiro-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{financeiro-organizacao-alternativa-id}}"
    - name: x-area-negocio-id
      value: "{{financeiro-area-outra-organizacao-id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("usuário não consulta organização sem vínculo", function() {
          expect(res.status).to.equal(403);
          expect(res.body.codigo).to.equal("ORGANIZACAO_NAO_AUTORIZADA");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
