info:
  name: 04 - Login administrador
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{clinico-admin-email}}",
        "senha": "{{clinico-admin-senha}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const setCookie = res.getHeader("set-cookie");
          const cookies = Array.isArray(setCookie) ? setCookie : [setCookie];
          const tokenCookie = cookies
            .filter(Boolean)
            .map(String)
            .find(function(cookie) { return cookie.startsWith("token="); });

          if (tokenCookie) {
            bru.setVar("clinico-admin-cookie", tokenCookie.split(";")[0]);
          }
        }
    - type: tests
      code: |-
        test("login do administrador retorna 200", function() {
          expect(res.status).to.equal(200);
        });
        test("login do administrador recebe cookie token", function() {
          expect(bru.getVar("clinico-admin-cookie")).to.match(/^token=.+/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
