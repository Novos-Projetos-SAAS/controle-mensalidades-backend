info:
  name: 07 - Concessao repetida
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/profissionais/{{profissional-id}}/acesso-clinico"
  headers:
    - name: Cookie
      value: "{{clinico-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  body:
    type: json
    data: |-
      {
        "autorizado": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("concessão repetida retorna conflito", function() {
          expect(res.status).to.equal(409);
          expect(res.body.codigo).to.equal("PERMISSAO_CLINICA_SEM_ALTERACAO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
