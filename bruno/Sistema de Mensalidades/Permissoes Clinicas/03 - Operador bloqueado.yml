info:
  name: 03 - Operador bloqueado
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/profissionais/{{profissional-id}}/acesso-clinico"
  headers:
    - name: Cookie
      value: "{{clinico-operador-cookie}}"
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  body:
    type: json
    data: |-
      {
        "autorizado": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("operador não pode conceder acesso", function() {
          expect(res.status).to.equal(403);
          expect(res.body.codigo).to.equal("PERFIL_NAO_AUTORIZADO");
        });
        test("resposta não simula concessão", function() {
          expect(res.body.data).to.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
