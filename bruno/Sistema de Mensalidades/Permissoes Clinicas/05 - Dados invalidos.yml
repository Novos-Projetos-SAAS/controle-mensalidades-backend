info:
  name: 05 - Dados invalidos
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/profissionais/{{profissional-id}}/acesso-clinico"
  headers:
    - name: Cookie
      value: "{{clinico-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  body:
    type: json
    data: |-
      {
        "autorizado": "true"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("tipo inválido retorna 400", function() {
          expect(res.status).to.equal(400);
          expect(res.body.codigo).to.equal("DADOS_PERMISSAO_CLINICA_INVALIDOS");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
