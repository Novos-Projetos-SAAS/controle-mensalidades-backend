info:
  name: Confirmar
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/agendamentos/{{agendamento-id}}/confirmar"
  headers:
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("confirmação retorna 200", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.status).to.equal("CONFIRMADO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
