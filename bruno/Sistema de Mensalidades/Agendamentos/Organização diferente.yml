info:
  name: Organização diferente
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/agendamentos/{{agendamento-id}}"
  headers:
    - name: x-organizacao-id
      value: "{{organizacao-alternativa-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("organização não vinculada retorna 403", function() {
          expect(res.status).to.equal(403);
          expect(res.body.codigo).to.equal("ORGANIZACAO_NAO_AUTORIZADA");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
