info:
  name: Listar com filtros
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/agendamentos?inicio=2026-11-10T00%3A00%3A00-03%3A00&fim=2026-11-11T00%3A00%3A00-03%3A00&profissionalId={{profissional-id}}&clienteId={{cliente-id}}&status=AGENDADO"
  headers:
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("filtros retornam 200", function() {
          expect(res.status).to.equal(200);
        });
        test("filtros retornam somente o agendamento esperado", function() {
          expect(res.body.data.length).to.equal(1);
          expect(res.body.data[0].id).to.equal(bru.getVar("agendamento-id"));
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
