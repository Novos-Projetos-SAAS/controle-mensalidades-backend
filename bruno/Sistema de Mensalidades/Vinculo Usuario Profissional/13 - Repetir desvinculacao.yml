info:
  name: 13 - Repetir desvinculacao
  type: http
  seq: 13

http:
  method: PATCH
  url: "{{baseUrl}}/profissionais/{{vinculo-profissional-id}}/usuario"
  headers:
    - name: Cookie
      value: "{{vinculo-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  body:
    type: json
    data: |-
      {
        "usuarioId": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("desvinculação repetida retorna 409", function() {
          expect(res.status).to.equal(409);
          expect(res.body.codigo).to.equal("VINCULO_USUARIO_SEM_ALTERACAO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
