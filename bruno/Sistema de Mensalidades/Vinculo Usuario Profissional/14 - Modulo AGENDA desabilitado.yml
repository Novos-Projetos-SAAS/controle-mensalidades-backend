info:
  name: 14 - Modulo AGENDA desabilitado
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{baseUrl}}/profissionais/{{vinculo-profissional-id}}/usuario"
  headers:
    - name: Cookie
      value: "{{vinculo-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{vinculo-area-sem-agenda-id}}"
  body:
    type: json
    data: |-
      {
        "usuarioId": "{{vinculo-usuario-id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("área sem AGENDA retorna 403", function() {
          expect(res.status).to.equal(403);
          expect(res.body.codigo).to.equal("MODULO_NAO_HABILITADO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
