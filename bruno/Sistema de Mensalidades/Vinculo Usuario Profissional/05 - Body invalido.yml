info:
  name: 05 - Body invalido
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/profissionais/{{vinculo-profissional-id}}/usuario"
  headers:
    - name: Cookie
      value: "{{vinculo-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  body:
    type: json
    data: |-
      {
        "usuarioId": "id-invalido"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("body inválido retorna 400", function() {
          expect(res.status).to.equal(400);
          expect(res.body.codigo).to.equal("DADOS_VINCULO_USUARIO_INVALIDOS");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
