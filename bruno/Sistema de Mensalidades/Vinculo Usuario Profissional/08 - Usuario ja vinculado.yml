info:
  name: 08 - Usuario ja vinculado
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/profissionais/{{vinculo-profissional-id}}/usuario"
  headers:
    - name: Cookie
      value: "{{vinculo-admin-cookie}}"
    - name: x-organizacao-id
      value: "{{organizacao-id}}"
    - name: x-area-negocio-id
      value: "{{area-negocio-id}}"
  body:
    type: json
    data: |-
      {
        "usuarioId": "{{vinculo-usuario-ja-associado-id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("usuário já vinculado retorna 409", function() {
          expect(res.status).to.equal(409);
          expect(res.body.codigo).to.equal("USUARIO_JA_VINCULADO_PROFISSIONAL");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
